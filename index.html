<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Family Feud</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arial Black',Arial,sans-serif;background:#0a1628;color:#fff;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#0d2244 0%,#060e1a 70%);z-index:-1}
.screen{display:none;padding:15px;max-width:1000px;margin:0 auto}.screen.active{display:block}
h1{text-align:center;color:#ffa500;font-size:2.2em;text-shadow:2px 2px 4px #000;margin-bottom:20px}
h2{color:#ffa500;margin-bottom:15px;text-align:center}
.btn{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:1em;font-weight:bold;transition:all .2s}
.btn-gold{background:linear-gradient(180deg,#ffa500,#e08900);color:#fff;border:2px solid #ffbf40}.btn-gold:hover{transform:scale(1.05);box-shadow:0 0 15px rgba(255,165,0,.6)}
.btn-red{background:#dc3545;color:#fff;border:2px solid #ff6b7a}.btn-red:hover{background:#c82333}
.btn-blue{background:linear-gradient(180deg,#3a6bc5,#2a4fa0);color:#fff;border:2px solid #5a8be5}.btn-blue:hover{background:#2a5db8}
.btn-green{background:#28a745;color:#fff;border:2px solid #5fd47a}.btn-green:hover{background:#218838}
.btn-sm{padding:6px 14px;font-size:.85em}
.setup-section{background:rgba(255,165,0,.06);border:2px solid rgba(255,165,0,.2);border-radius:12px;padding:20px;margin-bottom:20px}
.setup-section label{display:block;margin-bottom:5px;color:#ffa500;font-size:.9em}
.setup-section input{width:100%;padding:8px 12px;border-radius:6px;border:2px solid #1e3a6e;background:#0d1f3c;color:#fff;font-size:1em;margin-bottom:10px}
.setup-section input:focus{border-color:#ffa500;outline:none}
.answer-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.answer-row input:first-child{flex:3}.answer-row input:last-of-type{flex:1;text-align:center}
.question-card{background:rgba(255,165,0,.05);border:1px solid #ffa500;border-radius:10px;padding:15px;margin-bottom:12px}
.question-card h3{color:#ffa500;font-size:1em;margin-bottom:8px}
.tab-bar{display:flex;gap:5px;margin-bottom:15px}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;cursor:pointer;background:#0d1f3c;color:#aaa;border:1px solid #1e3a6e;border-bottom:none}
.tab.active{background:#1e3a6e;color:#ffa500;border-color:#ffa500}
.preset-list{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.team-score{text-align:center;background:linear-gradient(180deg,#1a3060,#0d1f3c);border:3px solid #ffa500;border-radius:12px;padding:12px 20px;min-width:160px}
.team-score .name{font-size:1em;color:#ffa500;text-transform:uppercase}.team-score .score{font-size:2.5em;color:#fff;font-weight:bold}
.team-score.active-team{box-shadow:0 0 25px rgba(255,165,0,.7),inset 0 0 15px rgba(255,165,0,.15);border-color:#ffcc00}
.round-info{text-align:center;flex:1;padding:0 10px}.round-info .round-num{font-size:1.2em;color:#ffa500}
.board-frame{position:relative;background:radial-gradient(ellipse at center,#0d2244,#08162e);border:5px solid #ffa500;border-radius:50%/40%;padding:45px 40px 50px;margin:30px auto 10px;max-width:800px;box-shadow:0 0 30px rgba(255,165,0,.3),inset 0 0 40px rgba(0,0,0,.5)}
.board-frame::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:3px solid #cc8500;border-radius:50%/40%;pointer-events:none}
.dots-left,.dots-right{position:absolute;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(4,12px);gap:6px;opacity:.8}
.dots-left{left:-70px}.dots-right{right:-70px}
.dot{width:12px;height:12px;background:radial-gradient(circle,#ffa500,#cc6600);border-radius:50%;box-shadow:0 0 4px #ffa500;animation:dotGlow 2s infinite alternate}
@keyframes dotGlow{0%{opacity:.5}100%{opacity:1}}
.score-crown{position:absolute;top:-28px;left:50%;transform:translateX(-50%);z-index:5;background:linear-gradient(180deg,#2a5db8,#1a3a78);border:3px solid #5a9aff;border-radius:10px;padding:4px 32px;min-width:90px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.score-crown .crown-pts{font-size:2em;font-weight:bold;color:#fff}
.q-area{text-align:center;margin-bottom:5px;padding:0 10px}
.q-area .q-text{font-size:1.1em;color:#fff;font-weight:bold;background:#111;border:2px solid #ffa500;border-radius:8px;padding:8px 20px;display:inline-block;max-width:700px}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;z-index:2}
.answer-slot{display:flex;align-items:center;border:2px solid #8ab4f0;border-radius:6px;height:48px;cursor:pointer;transition:all .3s;overflow:hidden}
.answer-slot.hidden{background:linear-gradient(180deg,#2a5098,#1a3568);border-color:#4a80c8}
.answer-slot.hidden .text,.answer-slot.hidden .pts{color:transparent}
.answer-slot.hidden:hover{border-color:#ffa500}
.answer-slot.revealed{background:linear-gradient(180deg,#4a8ae0,#2a60b0);border-color:#7ab4ff;box-shadow:0 0 10px rgba(74,138,224,.4)}
.answer-slot .text{flex:1;padding:0 12px;font-size:.95em;text-transform:uppercase;font-weight:bold;color:#fff}
.answer-slot .pts{width:55px;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.1em;color:#fff;font-weight:bold;background:rgba(0,0,0,.2);border-left:2px solid rgba(255,255,255,.2)}
.strikes{display:flex;justify-content:center;gap:20px;margin:12px 0}
.strike-x{font-size:3.5em;color:rgba(255,255,255,.1);transition:all .3s}
.strike-x.active{color:#ff3333;text-shadow:0 0 30px #ff0000,0 0 60px #ff0000;animation:strikeAnim .4s}
@keyframes strikeAnim{0%{transform:scale(2.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.controls{display:none!important}.round-pts{display:none!important}
.steal-overlay{display:none;position:fixed;bottom:0;left:0;width:100%;z-index:100;justify-content:center;padding:10px}
.steal-overlay.active{display:flex}
.steal-box{background:linear-gradient(180deg,#1a3060,#0d1f3c);border:4px solid #ffa500;border-radius:16px;padding:18px 30px;text-align:center;box-shadow:0 -4px 30px rgba(255,165,0,.5);max-width:600px;width:100%;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.steal-box h2{color:#ffa500;margin-bottom:10px;font-size:1.2em}
.steal-keys{display:flex;justify-content:center;gap:30px;margin-top:12px}
.steal-key{display:flex;align-items:center;gap:6px}
.steal-key .key{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:bold}
.key-y{background:rgba(40,167,69,.2);border:2px solid #5fd47a;color:#5fd47a}
.key-n{background:rgba(220,53,69,.2);border:2px solid #ff6b7a;color:#ff6b7a}
.steal-key span{font-size:.85em;color:#ccc}
/* Host panel */
.host-toggle{position:fixed;bottom:0;right:20px;z-index:50;background:linear-gradient(180deg,#ffa500,#e08900);color:#1a0a2e;border:none;border-radius:10px 10px 0 0;padding:8px 20px;font-weight:bold;cursor:pointer}
.host-panel{position:fixed;bottom:0;left:0;width:100%;background:linear-gradient(180deg,#111a2e,#0a1020);border-top:3px solid #ffa500;padding:15px 20px;z-index:40;transform:translateY(100%);transition:transform .3s ease;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.host-panel.open{transform:translateY(0)}
.host-panel .host-label{color:#ffa500;font-weight:bold;margin-right:8px}
.host-panel .round-pts-host{color:#ffa500;margin:0 10px}
.winner-screen{text-align:center;padding:40px}.winner-screen h1{font-size:3em;color:#ffa500}
.trophy{font-size:5em;margin:20px 0}.final-scores{display:flex;justify-content:center;gap:40px;margin:20px 0}
.shortcut-hint{color:#666;font-size:.7em;margin-top:8px;text-align:center}
@media(max-width:700px){.board-frame{border-radius:20px;padding:30px 15px}.dots-left,.dots-right{display:none}.answer-grid{grid-template-columns:1fr}.team-score{min-width:100px;padding:8px 12px}}
</style></head><body>

<div id="setupScreen" class="screen active">
<h1>🎯 FAMILY FEUD 🎯</h1>
<div class="tab-bar"><div class="tab active" onclick="showTab('teams')">Teams</div><div class="tab" onclick="showTab('questions')">Questions</div><div class="tab" onclick="showTab('presets')">Presets</div></div>
<div id="tab-teams" class="setup-section"><label>Team 1 Name</label><input id="team1Name" value="Family 1"><label>Team 2 Name</label><input id="team2Name" value="Family 2"></div>
<div id="tab-questions" class="setup-section" style="display:none"><div id="questionsList"></div><button class="btn btn-gold" onclick="addQuestion()" style="margin-top:10px">+ Add Question</button></div>
<div id="tab-presets" class="setup-section" style="display:none"><p style="color:#ccc;margin-bottom:10px">Load presets or import/export:</p><div class="preset-list"><button class="btn btn-blue btn-sm" onclick="loadPreset('general')">General Knowledge</button><button class="btn btn-blue btn-sm" onclick="loadPreset('food')">Food & Drinks</button><button class="btn btn-blue btn-sm" onclick="loadPreset('workplace')">Workplace Fun</button></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-green btn-sm" onclick="exportQuestions()">📤 Export</button><button class="btn btn-green btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importQuestions(event)"></div></div>
<div style="text-align:center;margin-top:20px"><button class="btn btn-gold" onclick="startGame()" style="font-size:1.3em;padding:14px 40px">🎬 START GAME!</button></div>
</div>

<div id="gameScreen" class="screen">
<div class="game-header"><div class="team-score" id="team1Box"><div class="name" id="t1name">Family 1</div><div class="score" id="t1score">0</div></div><div class="round-info"><div class="round-num" id="roundNum">Round 1</div></div><div class="team-score" id="team2Box"><div class="name" id="t2name">Family 2</div><div class="score" id="t2score">0</div></div></div>
<div class="q-area"><div class="q-text" id="qText2"></div></div>
<div class="board-frame"><div class="score-crown"><div class="crown-pts" id="boardPts">0</div></div><div class="dots-left"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="dots-right"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="answer-grid" id="gameBoard"></div></div>
<div class="strikes"><span class="strike-x" id="x1">✕</span><span class="strike-x" id="x2">✕</span><span class="strike-x" id="x3">✕</span></div>
<div class="round-pts">Pts:<span id="roundPts">0</span></div>
<div class="shortcut-hint">X=Strike | W=Award | S=Switch | 1-8=Reveal | →→=Next | ←←=Redo</div>
</div>

<button class="host-toggle" id="hostToggle" onclick="toggleHost()">🎮 Host Controls</button>
<div class="host-panel" id="hostPanel"><span class="host-label">🎮 HOST:</span><span class="round-pts-host">Round Pts: <span id="roundPtsHost">0</span></span>
<button class="btn btn-red btn-sm" onclick="addStrike()">✕ Strike</button><button class="btn btn-gold btn-sm" onclick="revealAll()">👁 Reveal All</button><button class="btn btn-blue btn-sm" onclick="switchTeam()">🔄 Switch</button><button class="btn btn-green btn-sm" onclick="awardPoints()">✓ Award Pts</button><button class="btn btn-gold btn-sm" onclick="nextRound()">➡ Next</button><button class="btn btn-red btn-sm" onclick="redoGame()">🔄 Redo</button></div>

<div class="steal-overlay" id="stealOverlay"><div class="steal-box"><h2>💥 STEAL OPPORTUNITY!</h2><p id="stealTeamName" style="font-size:1.2em;color:#fff;margin-bottom:4px"></p><p style="font-size:.55em;color:#444;margin-top:6px">y / n</p></div></div>

<div id="winnerScreen" class="screen"><div class="winner-screen"><div class="trophy">🏆</div><h1 id="winnerName">Winner!</h1><div class="final-scores" id="finalScores"></div><button class="btn btn-gold" onclick="resetGame()" style="font-size:1.2em;margin-top:20px">🔄 Play Again</button></div></div>

<script>
let questions=[],currentRound=0,scores=[0,0],activeTeam=0,strikes=0,roundPoints=0,revealedAnswers=[];
const presets={general:[{q:"Name something people do first thing in the morning",answers:[{t:"Check Phone",p:35},{t:"Brush Teeth",p:25},{t:"Use Bathroom",p:18},{t:"Drink Coffee",p:12},{t:"Shower",p:10}]},{q:"Name a reason someone might call in sick",answers:[{t:"Actually Sick",p:40},{t:"Mental Health Day",p:20},{t:"Job Interview",p:15},{t:"Family Emergency",p:15},{t:"Hangover",p:10}]},{q:"Name something in a junk drawer",answers:[{t:"Batteries",p:28},{t:"Tape",p:22},{t:"Scissors",p:18},{t:"Pens",p:17},{t:"Keys",p:15}]}],food:[{q:"Name a popular pizza topping",answers:[{t:"Pepperoni",p:40},{t:"Mushrooms",p:20},{t:"Sausage",p:15},{t:"Extra Cheese",p:15},{t:"Olives",p:10}]},{q:"Name a food people eat at movies",answers:[{t:"Popcorn",p:45},{t:"Candy",p:22},{t:"Nachos",p:15},{t:"Hot Dog",p:10},{t:"Ice Cream",p:8}]},{q:"Name a breakfast food",answers:[{t:"Eggs",p:30},{t:"Pancakes",p:25},{t:"Bacon",p:20},{t:"Cereal",p:15},{t:"Toast",p:10}]}],workplace:[{q:"Name something annoying in meetings",answers:[{t:"Going Over Time",p:30},{t:"Multitasking",p:25},{t:"Bad Audio",p:20},{t:"No Agenda",p:15},{t:"Someone Dominates",p:10}]},{q:"Name something in an office kitchen",answers:[{t:"Coffee Maker",p:35},{t:"Microwave",p:25},{t:"Fridge",p:20},{t:"Snacks",p:12},{t:"Dirty Dishes",p:8}]},{q:"Name a reason to be late to work",answers:[{t:"Traffic",p:35},{t:"Overslept",p:30},{t:"Kids",p:15},{t:"Car Trouble",p:12},{t:"Weather",p:8}]}]};
function showTab(t){document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.remove('active');document.querySelectorAll('.setup-section')[i].style.display='none'});const tabs=['teams','questions','presets'];const idx=tabs.indexOf(t);document.querySelectorAll('.tab')[idx].classList.add('active');document.querySelectorAll('.setup-section')[idx].style.display='block'}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function addQuestion(q,ans){questions.push({q:q||'',answers:ans||[{t:'',p:0}]});renderQuestions()}
function renderQuestions(){const c=document.getElementById('questionsList');c.innerHTML='';questions.forEach((q,qi)=>{let h='<div class="question-card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Q'+(qi+1)+'</h3><button class="btn btn-red btn-sm" onclick="removeQ('+qi+')">🗑</button></div><input value="'+escH(q.q)+'" placeholder="Enter survey question..." onchange="questions['+qi+'].q=this.value" style="margin:8px 0">';q.answers.forEach((a,ai)=>{h+='<div class="answer-row"><input value="'+escH(a.t)+'" placeholder="Answer '+(ai+1)+'" onchange="questions['+qi+'].answers['+ai+'].t=this.value"><input type="number" value="'+a.p+'" placeholder="Pts" onchange="questions['+qi+'].answers['+ai+'].p=parseInt(this.value)||0"><button class="btn btn-red btn-sm" onclick="removeA('+qi+','+ai+')">✕</button></div>'});h+='<button class="btn btn-blue btn-sm" onclick="addAns('+qi+')" style="margin-top:5px">+ Answer</button></div>';c.innerHTML+=h})}
function removeQ(i){questions.splice(i,1);renderQuestions()}
function addAns(qi){questions[qi].answers.push({t:'',p:0});renderQuestions()}
function removeA(qi,ai){questions[qi].answers.splice(ai,1);renderQuestions()}
function loadPreset(n){questions=JSON.parse(JSON.stringify(presets[n]));showTab('questions');renderQuestions()}
function exportQuestions(){const b=new Blob([JSON.stringify(questions,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='familyfeud_questions.json';a.click()}
function importQuestions(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{questions=JSON.parse(ev.target.result);showTab('questions');renderQuestions()}catch(err){alert('Invalid JSON')}};r.readAsText(f)}
function startGame(){if(!questions.length){alert('Add at least one question!');return}const v=questions.filter(q=>q.q&&q.answers.length&&q.answers.some(a=>a.t));if(!v.length){alert('Add valid questions!');return}questions=v;currentRound=0;scores=[0,0];activeTeam=0;document.getElementById('t1name').textContent=document.getElementById('team1Name').value||'Family 1';document.getElementById('t2name').textContent=document.getElementById('team2Name').value||'Family 2';showScreen('gameScreen');loadRound()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function loadRound(){const q=questions[currentRound];strikes=0;roundPoints=0;revealedAnswers=[];document.getElementById('roundNum').textContent='Round '+(currentRound+1)+' of '+questions.length;document.getElementById('boardPts').textContent='0';var qt=document.getElementById('qText2');if(qt)qt.textContent=q.q;document.getElementById('roundPts').textContent='0';updateRPD();updateBoardPts();resetStrikes();updateTeamHL();let b=document.getElementById('gameBoard');b.innerHTML='';
var sorted=q.answers.map((a,i)=>({t:a.t,p:a.p,oi:i})).sort((a,b)=>b.p-a.p);
var rows=Math.ceil(sorted.length/2);while(sorted.length<rows*2)sorted.push(null);
var grid=[];for(var r=0;r<rows;r++){grid.push(sorted[r]);grid.push(sorted[r+rows])}
grid.forEach((a)=>{if(a)b.innerHTML+='<div class="answer-slot hidden" id="slot'+a.oi+'" onclick="reveal('+a.oi+')"><div class="text">'+escH(a.t)+'</div><div class="pts">'+a.p+'</div></div>';else b.innerHTML+='<div style="visibility:hidden;height:48px"></div>'});updateScores()}
function reveal(i){if(revealedAnswers.includes(i))return;revealedAnswers.push(i);const s=document.getElementById('slot'+i);s.classList.remove('hidden');s.classList.add('revealed');roundPoints+=questions[currentRound].answers[i].p;document.getElementById('roundPts').textContent=roundPoints;updateRPD();updateBoardPts();playDing()}
function addStrike(){if(strikes>=3)return;strikes++;document.getElementById('x'+strikes).classList.add('active');playBuzzer();if(strikes>=3){const o=activeTeam===0?1:0;const n=[document.getElementById('t1name').textContent,document.getElementById('t2name').textContent];document.getElementById('stealTeamName').textContent=n[o]+' can steal!';document.getElementById('stealOverlay').classList.add('active')}}
function resetStrikes(){strikes=0;[1,2,3].forEach(i=>document.getElementById('x'+i).classList.remove('active'))}
function stealSuccess(){document.getElementById('stealOverlay').classList.remove('active');activeTeam=activeTeam===0?1:0;updateTeamHL();resetStrikes();awardPoints()}
function stealFail(){document.getElementById('stealOverlay').classList.remove('active');resetStrikes();awardPoints()}
function switchTeam(){activeTeam=activeTeam===0?1:0;resetStrikes();updateTeamHL()}
function updateTeamHL(){document.getElementById('team1Box').classList.toggle('active-team',activeTeam===0);document.getElementById('team2Box').classList.toggle('active-team',activeTeam===1)}
function awardPoints(){scores[activeTeam]+=roundPoints;roundPoints=0;document.getElementById('roundPts').textContent='0';updateRPD();updateBoardPts();updateScores()}
function updateScores(){document.getElementById('t1score').textContent=scores[0];document.getElementById('t2score').textContent=scores[1]}
function updateBoardPts(){document.getElementById('boardPts').textContent=roundPoints}
function updateRPD(){const el=document.getElementById('roundPtsHost');if(el)el.textContent=document.getElementById('roundPts').textContent}
function revealAll(){questions[currentRound].answers.forEach((_,i)=>reveal(i))}
function nextRound(){if(currentRound>=questions.length-1){endGame();return}currentRound++;activeTeam=currentRound%2;loadRound()}
function endGame(){const n=[document.getElementById('t1name').textContent,document.getElementById('t2name').textContent];const w=scores[0]>scores[1]?n[0]:scores[1]>scores[0]?n[1]:'TIE';document.getElementById('winnerName').textContent=scores[0]===scores[1]?"It's a Tie!":w+' Wins!';document.getElementById('finalScores').innerHTML='<div class="team-score"><div class="name">'+escH(n[0])+'</div><div class="score">'+scores[0]+'</div></div><div class="team-score"><div class="name">'+escH(n[1])+'</div><div class="score">'+scores[1]+'</div></div>';showScreen('winnerScreen')}
function resetGame(){scores=[0,0];currentRound=0;showScreen('setupScreen')}
function redoGame(){scores=[0,0];currentRound=0;activeTeam=0;showScreen('gameScreen');loadRound()}
function toggleHost(){document.getElementById('hostPanel').classList.toggle('open');document.getElementById('hostToggle').textContent=document.getElementById('hostPanel').classList.contains('open')?'✕ Hide Controls':'🎮 Host Controls'}
var audioCtx=null;
function playDing(){
try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
var t=audioCtx.currentTime;
function tone(freq,start,dur,vol){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(freq,t+start);g.gain.setValueAtTime(vol,t+start);g.gain.exponentialRampToValueAtTime(0.001,t+start+dur);o.start(t+start);o.stop(t+start+dur)}
tone(1047,0,0.15,0.25);tone(1319,0.06,0.15,0.25);tone(1568,0.12,0.2,0.3);
}catch(e){}}
function playBuzzer(){
try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
var t=audioCtx.currentTime;
function buzz(freq,start,dur,vol){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sawtooth';o.frequency.setValueAtTime(freq,t+start);o.frequency.linearRampToValueAtTime(freq*0.8,t+start+dur);g.gain.setValueAtTime(vol,t+start);g.gain.linearRampToValueAtTime(0,t+start+dur);o.start(t+start);o.stop(t+start+dur)}
buzz(150,0,0.5,0.2);buzz(120,0,0.5,0.15);buzz(90,0.15,0.4,0.15);
}catch(e){}}
var dtTimers={};
function doubleTap(id,fn){var now=Date.now();if(dtTimers[id]&&now-dtTimers[id]<500){dtTimers[id]=0;fn()}else{dtTimers[id]=now}}
document.addEventListener('keydown',function(e){
if(!document.getElementById('gameScreen').classList.contains('active'))return;
var k=e.key.toLowerCase();
if(document.getElementById('stealOverlay').classList.contains('active')){
if(k==='y'){e.preventDefault();stealSuccess()}else if(k==='n'){e.preventDefault();stealFail()}return}
if(k==='x'){e.preventDefault();addStrike()}
else if(k==='w'){e.preventDefault();awardPoints()}
else if(k==='s'){e.preventDefault();switchTeam()}
else if(k>='1'&&k<='8'){e.preventDefault();var idx=parseInt(k)-1;if(idx<questions[currentRound].answers.length)reveal(idx)}
else if(e.key==='ArrowRight'||k===']'){e.preventDefault();doubleTap('next',nextRound)}
else if(e.key==='ArrowLeft'||k==='['){e.preventDefault();doubleTap('redo',redoGame)}
});
